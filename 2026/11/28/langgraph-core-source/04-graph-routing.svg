<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#78877b"/></marker>
<style>
.bg{fill:#fbfaf6}
.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#26372c}
.subtitle{font:400 17px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#68766b}
.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#26372c;text-anchor:middle}
.p{font:400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#58675d;text-anchor:middle}
.small{font:400 13px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#66736a;text-anchor:middle}
.note{font:500 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#536258}
.tag{font:700 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#4d654f;text-anchor:middle}
.arrow{fill:none;stroke:#78877b;stroke-width:2.5;marker-end:url(#arr)}
.line{fill:none;stroke:#aab4aa;stroke-width:2}
</style>
</defs>
<rect class="bg" width="1500" height="900" rx="22"/>
<text class="title" x="54" y="62">Adaptive-RAG 的 Graph 主流程</text>
<text class="subtitle" x="54" y="96">Graph 负责组织节点和路由；节点负责具体业务处理</text>
<rect x="45" y="150" width="140" height="82" rx="16" fill="#ffffff" stroke="#9ba99d" stroke-width="2.2"/><text class="h" x="115.0" y="184.0">START</text><text class="p" x="115.0" y="213.0">入口</text><rect x="235" y="150" width="220" height="82" rx="16" fill="#f8e9e6" stroke="#bd8278" stroke-width="2.2"/><text class="h" x="345.0" y="184.0">apply_guardrail</text><text class="p" x="345.0" y="213.0">安全检查</text><rect x="505" y="140" width="250" height="102" rx="16" fill="#fff4dc" stroke="#b99d5d" stroke-width="2.2"/><text class="h" x="630.0" y="184.0">_after_guardrail</text><text class="p" x="630.0" y="213.0">检查 refused 状态</text><rect x="825" y="150" width="200" height="82" rx="16" fill="#e7f0e3" stroke="#789574" stroke-width="2.2"/><text class="h" x="925.0" y="184.0">classify_intent</text><text class="p" x="925.0" y="213.0">识别意图</text><rect x="1095" y="150" width="210" height="82" rx="16" fill="#e7f0e3" stroke="#789574" stroke-width="2.2"/><text class="h" x="1200.0" y="184.0">route_complexity</text><text class="p" x="1200.0" y="213.0">router_node</text><path class="arrow" d="M185 191 H225"/><path class="arrow" d="M455 191 H495"/><path class="arrow" d="M755 191 H815"/><path class="arrow" d="M1025 191 H1085"/><text class="small" x="630" y="285" text-anchor="middle">refused=True → refuse_answer；refused=False → classify_intent</text><path class="arrow" d="M1200 232 V335"/><rect x="1025" y="335" width="350" height="90" rx="16" fill="#fff4dc" stroke="#b99d5d" stroke-width="2.2"/><text class="h" x="1200.0" y="373.0">_route_after_complexity</text><text class="p" x="1200.0" y="402.0">读取 strategy 并选择目标节点</text><path class="line" d="M1200 425 V480 H180 V535 M1200 480 H500 V535 M1200 480 H820 V535 M1200 480 H1250 V535"/><rect x="65" y="535" width="230" height="105" rx="16" fill="#e7f0e3" stroke="#789574" stroke-width="2.2"/><text class="h" x="180.0" y="580.5">DIRECT</text><text class="p" x="180.0" y="609.5">generate_answer</text><rect x="385" y="535" width="230" height="105" rx="16" fill="#e5edf7" stroke="#8098b5" stroke-width="2.2"/><text class="h" x="500.0" y="580.5">SINGLE / MULTI</text><text class="p" x="500.0" y="609.5">retrieve_docs</text><rect x="705" y="535" width="230" height="105" rx="16" fill="#f5edda" stroke="#b99d5d" stroke-width="2.2"/><text class="h" x="820.0" y="580.5">AGENT</text><text class="p" x="820.0" y="609.5">plan_tasks</text><rect x="1135" y="535" width="230" height="105" rx="16" fill="#f8e9e6" stroke="#bd8278" stroke-width="2.2"/><text class="h" x="1250.0" y="580.5">REFUSE</text><text class="p" x="1250.0" y="609.5">refuse_answer</text><rect x="65" y="730" width="620" height="100" rx="16" fill="#edf4e9" stroke="#789574" stroke-width="2.2"/><text class="h" x="375.0" y="773.0">正常回答路线</text><text class="p" x="375.0" y="802.0">generate_answer → check_faithfulness → compact_memory → END</text><rect x="815" y="730" width="550" height="100" rx="16" fill="#f8eeeb" stroke="#bd8278" stroke-width="2.2"/><text class="h" x="1090.0" y="773.0">拒绝回答路线</text><text class="p" x="1090.0" y="802.0">refuse_answer → compact_memory → END</text><text class="small" x="740" y="870" text-anchor="middle">SINGLE 与 MULTI 共用 retrieve_docs；检索差异在 retrieval_node 内部处理。</text></svg>